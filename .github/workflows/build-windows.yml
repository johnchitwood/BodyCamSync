name: Build Windows app

# Run it by hand from the Actions tab ("Run workflow"), or push a tag such as v0.2.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  WHISPER_CPP_TAG: v1.9.5   # speech engine version, built from source below

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The speech engine is compiled here so no unknown binary is downloaded. AVX2 (not "this machine's"
      # CPU) keeps it runnable on any PC from the last decade; the C runtime is linked in so no
      # Visual C++ redistributable is needed.
      - name: Build whisper.cpp
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:WHISPER_CPP_TAG https://github.com/ggml-org/whisper.cpp whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build whisper.cpp/build --config Release --target whisper-cli -j 4
          New-Item -ItemType Directory -Force resources/win | Out-Null
          Copy-Item whisper.cpp/build/bin/Release/whisper-cli.exe resources/win/whisper-cli.exe
          Get-ChildItem whisper.cpp/build/bin/Release/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination resources/win

      - name: Smoke test (ffmpeg, sync engine, speech engine, speaker detection)
        run: npm run smoke

      - name: Build installer and portable zip
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: BodyCamSync-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
